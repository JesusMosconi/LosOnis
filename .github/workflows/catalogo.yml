name: Catálogo ACERCO

on:
  schedule:
    # 06:00 Argentina. GitHub may delay scheduled runs.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogo-acerco-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependencias y generar Prisma
        # Prisma config requires a URL even for client generation. No DB access.
        run: npm ci
        env:
          DATABASE_URL: postgresql://localhost:5432/build
      - name: Sincronizar catálogo completo
        id: sync
        timeout-minutes: 25
        run: npm run catalogo:sync
        env:
          DATABASE_URL: ${{ secrets.CATALOGO_DATABASE_URL }}
      - name: Cerrar ejecución interrumpida
        if: ${{ always() && steps.sync.outputs.sync-id != '' }}
        timeout-minutes: 2
        run: npm run catalogo:finalize
        env:
          DATABASE_URL: ${{ secrets.CATALOGO_DATABASE_URL }}
          CATALOG_SYNC_ID: ${{ steps.sync.outputs.sync-id }}
